# Merge with compose.yaml; do not run as a standalone file.
services:
  backend:
    image: ${BACKEND_IMAGE:-rare-sperm-annotation-backend:local-gpu}
    build:
      args:
        PYTORCH_INDEX_URL: ${PYTORCH_INDEX_URL:-https://download.pytorch.org/whl/cu132}
    environment:
      SAM3_ENABLED: "true"
      SAM3_DEVICE: cuda
      HEAD_DETECTOR_DEVICE: cuda:0
      SAM3_DTYPE: ${SAM3_DTYPE:-bfloat16}
    volumes:
      - type: bind
        source: ${SAM3_MODEL_HOST_PATH:-./models/sam3}
        target: /models/sam3
        read_only: true
        bind:
          create_host_path: false
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    shm_size: "2gb"

  model-setup:
    image: python:3.12-slim-bookworm
    profiles: [model-setup]
    entrypoint: [python, /setup/scripts/prepare_model.py]
    environment:
      SAM3_AUTO_DOWNLOAD: ${SAM3_AUTO_DOWNLOAD:-true}
    volumes:
      - type: bind
        source: ${SAM3_MODEL_HOST_PATH:-./models/sam3}
        target: /models/sam3
      - type: bind
        source: ./scripts
        target: /setup/scripts
        read_only: true
      - type: bind
        source: ./model-distribution
        target: /setup/model-distribution
        read_only: true
