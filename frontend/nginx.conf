server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Must match MAX_PACKAGE_BYTES: annotation packages reach 8 GiB, videos 2 GiB.
    client_max_body_size 8g;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Docker's DNS must be re-resolved when the backend container is recreated.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream backend:3000;
        # No trailing slash: preserve the /api prefix expected by FastAPI.
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }
}
