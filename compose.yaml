name: rare-sperm-annotation

services:
  backend:
    image: ${BACKEND_IMAGE:-rare-sperm-annotation-backend:local-cpu}
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PYTORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
    environment:
      APP_ENV: production
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 3000
      APP_DATA_DIR: /data/database
      APP_DB_FILE: /data/database/app.db
      APP_STORAGE_DIR: /data/storage
      SAM3_ENABLED: "false"
      SAM3_MODEL_ID: /models/sam3
      SAM3_DEVICE: cpu
      HEAD_DETECTOR_DEVICE: cpu
      SAM3_DTYPE: float32
      SAM3_TRACK_FRAMES: ${SAM3_TRACK_FRAMES:-120}
      ANOMALY_REVIEW_LOOKBACK_FRAMES: ${ANOMALY_REVIEW_LOOKBACK_FRAMES:-5}
      ANOMALY_SIDE_EXIT_MARGIN_PX: ${ANOMALY_SIDE_EXIT_MARGIN_PX:-10}
      JWT_SECRET: ${JWT_SECRET:?请先运行部署脚本或配置 .env 中的 JWT_SECRET}
    volumes:
      - type: bind
        source: ${APP_DATA_ROOT:-./runtime}/storage
        target: /data/storage
      - type: bind
        source: ${APP_DATA_ROOT:-./runtime}/database
        target: /data/database
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/api/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 30s
    stop_grace_period: 60s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ${FRONTEND_IMAGE:-rare-sperm-annotation-frontend:local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
